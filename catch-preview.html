<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐치! 티니핑 PC 미리보기</title>
<style>
:root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
* { box-sizing: border-box; }
html,body { margin:0; min-height:100%; background:radial-gradient(circle at 50% 28%,#43205d,#11101c 65%); color:#fff; }
body { display:grid; place-items:center; padding:24px; }
.preview { width:min(92vw,620px); text-align:center; }
h1 { margin:0 0 8px; font-size:clamp(24px,5vw,42px); }
.lead { margin:0 0 24px; color:#e7d9f3; }
.stage { position:relative; min-height:430px; display:grid; place-items:center; overflow:hidden; border:1px solid #754f91; border-radius:28px; background:rgba(15,9,28,.6); box-shadow:0 20px 60px #0008; }
#catchCharacter { width:130px; height:170px; display:grid; place-items:center; font-size:94px; filter:drop-shadow(0 12px 16px #0008); transform-style:preserve-3d; }
#catchCharacter.spin { animation:catchSpin 1s cubic-bezier(.18,.75,.22,1) both; }
@keyframes catchSpin { from { transform:rotateY(0deg); } to { transform:rotateY(720deg); } }
#catchCelebrationOverlay { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,95,170,.12) 42%,transparent 72%); animation:overlayIn .35s ease-out both; }
#catchCelebrationOverlay[hidden] { display:none; }
.card { width:min(82vw,470px); animation:logoBurst 1s cubic-bezier(.18,.75,.22,1) both; }
#catchTeeniepingLogo { display:block; width:100%; height:auto; filter:drop-shadow(0 14px 24px rgba(61,13,56,.5)); }
.success { margin:0; color:#fff; font-size:clamp(24px,6vw,44px); font-weight:900; text-shadow:0 3px 12px #d81787,0 0 24px #ff9ed9; }
button { margin-top:22px; border:0; border-radius:999px; padding:13px 24px; background:#ff5fd2; color:#fff; font-weight:800; font-size:16px; cursor:pointer; box-shadow:0 8px 20px #ff5fd255; }
button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
@keyframes logoBurst { from { opacity:0; transform:scale(.55) rotate(-8deg); } to { opacity:1; transform:scale(1) rotate(0); } }
@keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
</style>
</head>
<body>
<main class="preview">
  <h1>캐치! 티니핑 PC 미리보기</h1>
  <p class="lead">AR 없이 잡기 성공 효과만 재생합니다. 캐릭터가 1초에 2회 회전합니다.</p>
  <section class="stage" aria-label="캐치 성공 미리보기">
    <div id="catchCharacter" aria-label="캐릭터">🧚‍♀️</div>
    <div id="catchCelebrationOverlay" role="status" aria-live="assertive" aria-label="캐치! 티니핑">
      <div class="card">
        <img id="catchTeeniepingLogo" src="./assets/catch-teenieping-logo-ko.png" alt="캐치! 티니핑">
        <p class="success">캐치 성공!</p>
      </div>
    </div>
  </section>
  <button id="replayCatch" type="button">다시 보기</button>
</main>
<script>
const character = document.querySelector('#catchCharacter');
const overlay = document.querySelector('#catchCelebrationOverlay');
function replayCatch() {
  character.classList.remove('spin');
  overlay.hidden = true;
  void character.offsetWidth;
  void overlay.offsetWidth;
  character.classList.add('spin');
  overlay.hidden = false;
}
document.querySelector('#replayCatch').addEventListener('click', replayCatch);
replayCatch();
</script>
</body>
</html>
