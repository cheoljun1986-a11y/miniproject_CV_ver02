<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#111111"/>
<title>WebXR Hidden Ninja v2</title>
<style>
  :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; z-index:10; pointer-events:none; }
  .card {
    position:absolute; left:12px; top:12px; max-width:calc(100vw - 24px);
    padding:9px 11px; border-radius:12px; background:rgba(0,0,0,.58);
    backdrop-filter:blur(7px); color:white; font-size:13px; line-height:1.45;
  }
  #metrics { top:86px; white-space:pre-line; font-variant-numeric:tabular-nums; }
  #message {
    position:absolute; left:50%; bottom:98px; transform:translateX(-50%);
    width:min(88vw,560px); padding:10px 14px; border-radius:999px;
    background:rgba(0,0,0,.62); color:white; text-align:center; font-size:14px;
  }
  #controls {
    position:absolute; left:10px; right:10px; bottom:18px;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap; pointer-events:auto;
  }
  button.ctrl {
    border:0; border-radius:999px; padding:11px 14px; font-weight:800; font-size:14px;
    background:rgba(255,255,255,.92); color:#111; box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  button.ctrl.primary { background:#fff; }
  button.ctrl.warn { background:#ffd66b; }
  button.ctrl:disabled { opacity:.42; }
  #scanFlash { position:absolute; inset:0; border:0 solid rgba(255,255,255,0); transition:border-width .08s,border-color .08s; }
  #crosshair { position:absolute; left:50%; top:50%; width:34px; height:34px; transform:translate(-50%,-50%); }
  #crosshair:before,#crosshair:after { content:""; position:absolute; background:rgba(255,255,255,.8); }
  #crosshair:before { left:16px; top:0; width:2px; height:34px; }
  #crosshair:after { left:0; top:16px; width:34px; height:2px; }
  #fallback { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:24px; background:#111; color:white; }
  #fallback .box { max-width:620px; line-height:1.6; }
  code { background:#222; padding:2px 6px; border-radius:6px; }
  #catchCelebrationOverlay {
    position:fixed; inset:0; z-index:19; display:none;
    align-items:center; justify-content:center; pointer-events:none; overflow:hidden;
    background:radial-gradient(circle at center,rgba(255,255,255,.3),rgba(255,95,170,.13) 38%,transparent 70%);
  }
  .catch-celebration-card {
    width:min(78vw,520px); text-align:center;
    filter:drop-shadow(0 14px 24px rgba(61,13,56,.42));
    animation:catchLogoBurst 1s cubic-bezier(.18,.75,.22,1) both;
  }
  #catchTeeniepingLogo { display:block; width:100%; height:auto; }
  .catch-celebration-text {
    margin-top:4px; color:#fff; font-size:clamp(24px,8vw,52px); font-weight:950;
    letter-spacing:.04em; text-shadow:0 3px 12px #d81787,0 0 24px #ff9ed9;
  }
  @keyframes catchLogoBurst {
    0% { opacity:0; transform:scale(.3) rotate(-8deg); }
    28% { opacity:1; transform:scale(1.12) rotate(3deg); }
    72% { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(.92); }
  }
  @media (prefers-reduced-motion:reduce) {
    .catch-celebration-card { animation:catchLogoFade 1s linear both; }
    @keyframes catchLogoFade { 0%,100% { opacity:0; } 15%,85% { opacity:1; } }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="catchCelebrationOverlay" role="status" aria-live="assertive" aria-label="캐치! 티니핑">
  <div class="catch-celebration-card">
    <img id="catchTeeniepingLogo" src="./assets/catch-teenieping-logo.png" alt="캐치! 티니핑"/>
    <div class="catch-celebration-text">캐치 성공!</div>
  </div>
</div>
<div id="hud">
  <div class="card" id="status">WebXR 확인 중…</div>
  <div class="card" id="metrics">pose: -</div>
  <div id="crosshair"></div>
  <div id="message">START AR을 누른 뒤 천천히 주변 바닥/책상을 비춰주세요.</div>
  <div id="scanFlash"></div>
  <div id="controls">
    <button class="ctrl primary" id="scanBtn" disabled>SCAN</button>
    <button class="ctrl" id="newRoundBtn" disabled>다시 숨기기</button>
    <button class="ctrl" id="extendBtn" disabled>+20초 스캔</button>
    <button class="ctrl warn" id="markBtn" disabled>기준점 저장</button>
    <button class="ctrl warn" id="checkBtn" disabled>복귀 오차 확인</button>
    <button class="ctrl" id="terrainOverlayBtn" style="display:none">지형 보기</button>
    <button class="ctrl" id="operatorBtn" style="display:none">운영자 뷰</button>
  </div>
  <div id="operatorOverlay" style="position:absolute; inset:0; z-index:20; display:none; background:#0b0b0b; pointer-events:auto;">
    <canvas id="operatorCanvas" style="width:100%; height:100%; display:block;"></canvas>
    <div class="card" id="operatorStatus" style="z-index:21; white-space:pre-line;">운영자 공간지도 · 복셀 0
고정 -
Ninja -
플레이어 - · 경로 0점</div>
    <button class="ctrl primary" id="operatorCloseBtn" style="position:absolute; right:12px; top:12px;">게임으로</button>
  </div>
</div>
<div id="fallback">
  <div class="box">
    <h2>WebXR AR을 시작할 수 없습니다.</h2>
    <p>ARCore 지원 Android + 최신 Chrome + HTTPS 주소인지 확인해 주세요.</p>
    <p id="fallbackDetail"></p>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
