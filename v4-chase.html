<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#111111"/>
<title>WebXR Hachuping Chase v4</title>
<style>
  :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; }
  /* Android answers a long press on text with the selection toolbar, and
     dismissing that toolbar with Back closes Chrome. Nothing in the HUD is
     meant to be selectable, so turn selection off everywhere. */
  html,body,#hud,#hud * {
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  canvas { display:block; }
  #hud {
    position:fixed; inset:0; z-index:10; pointer-events:none;
  }
  .card {
    position:absolute; left:12px; top:12px;
    max-width:calc(100vw - 24px);
    padding:9px 11px; border-radius:12px;
    background:rgba(0,0,0,.58); backdrop-filter:blur(7px);
    color:white; font-size:13px; line-height:1.45;
  }
  #metrics { top:86px; white-space:pre-line; font-variant-numeric:tabular-nums; }
  #hudToggle {
    position:absolute; right:12px; top:12px; z-index:16;
    border:0; border-radius:999px; padding:7px 12px;
    font-size:12px; font-weight:800; color:#fff;
    background:rgba(0,0,0,.58); backdrop-filter:blur(7px);
    pointer-events:auto; touch-action:manipulation;
  }
  #message {
    position:absolute; left:50%; bottom:168px; transform:translateX(-50%);
    width:min(88vw,560px); padding:10px 14px; border-radius:999px;
    background:rgba(0,0,0,.62); color:white; text-align:center; font-size:14px;
  }
  /* Android's gesture bar and the 3-button Back key both live at the very
     bottom of the screen, so the control row has to clear them. */
  #controls {
    position:absolute; left:10px; right:10px;
    bottom:calc(64px + env(safe-area-inset-bottom, 0px));
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    pointer-events:auto;
  }
  button.ctrl {
    border:0; border-radius:999px; padding:11px 14px;
    font-weight:800; font-size:14px; touch-action:manipulation;
    background:rgba(255,255,255,.92); color:#111;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  button.ctrl.primary { background:#fff; }
  button.ctrl.warn { background:#ffd66b; }
  button.ctrl:disabled { opacity:.42; }
  #scanFlash {
    position:absolute; inset:0; border:0 solid rgba(255,255,255,0);
    transition:border-width .08s,border-color .08s;
  }
  #crosshair {
    position:absolute; left:50%; top:50%; width:34px; height:34px;
    transform:translate(-50%,-50%);
  }
  #crosshair:before,#crosshair:after {
    content:""; position:absolute; background:rgba(255,255,255,.8);
  }
  #crosshair:before { left:16px; top:0; width:2px; height:34px; }
  #crosshair:after { left:0; top:16px; width:34px; height:2px; }
  #fallback {
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    padding:24px; background:#111; color:white;
  }
  #fallback .box { max-width:620px; line-height:1.6; }
  code { background:#222; padding:2px 6px; border-radius:6px; }

  /* ── 도망 모드 ─────────────────────────────────────────── */
  #chasePanel {
    position:absolute; left:50%; bottom:216px; transform:translateX(-50%);
    width:min(84vw,460px); display:none; flex-direction:column; gap:6px;
    align-items:center; pointer-events:none;
  }
  #chaseGauge {
    width:100%; height:14px; border-radius:999px; overflow:hidden;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25);
  }
  #chaseGaugeFill { height:100%; width:0%; background:#556; transition:width .08s linear; }
  #chaseHint {
    font-size:13px; font-weight:700; color:#fff; text-shadow:0 1px 4px #000;
  }
  #chaseArrow {
    position:absolute; left:50%; top:50%; width:0; height:0; display:none;
    border-left:16px solid transparent; border-right:16px solid transparent;
    border-bottom:30px solid #ff5fd2;
    filter:drop-shadow(0 0 4px rgba(0,0,0,.7));
    margin-top:-96px; pointer-events:none; z-index:15;
  }
  button.ctrl.chase { background:#ff5fd2; color:#fff; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script>
  // 도망 모드는 누적 공간지도가 있어야 동작한다. 파라미터가 없으면
  // CPU 깊이 가림 모드로 한 번 다시 연다.
  (function () {
    var p = new URLSearchParams(location.search);
    if (!p.get('occlusion') && !p.get('depth')) {
      p.set('occlusion', 'cpu');
      location.replace(location.pathname + '?' + p.toString());
    }
  })();
</script>
<script>
  // Second line of defence: even with selection off, a long press on some
  // Android builds still raises a context menu.
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
</script>
<div id="hud">
  <div class="card" id="status">WebXR 확인 중…</div>
  <div class="card" id="metrics">pose: -</div>
  <button id="hudToggle" type="button">수치</button>
  <div id="crosshair"></div>
  <div id="message">START AR → 맵 생성으로 방을 스캔 → 맵 생성 종료를 누르면 바로 하츄핑이 도망칩니다.</div>
  <div id="scanFlash"></div>
  <div id="chaseArrow"></div>
  <div id="chasePanel">
    <div id="chaseGauge"><div id="chaseGaugeFill"></div></div>
    <div id="chaseHint">—</div>
  </div>
  <div id="controls">
    <button class="ctrl warn" id="mapBtn">맵 생성</button>
    <button class="ctrl" id="operatorBtn" style="display:none">운영자 뷰</button>
  </div>
  <div id="operatorOverlay" style="position:absolute; inset:0; z-index:20; display:none; background:#0b0b0b; pointer-events:auto;">
    <canvas id="operatorCanvas" style="width:100%; height:100%; display:block;"></canvas>
    <div class="card" id="operatorStatus" style="z-index:21; white-space:pre-line;">운영자 공간지도 · 복셀 0
고정 -
Ninja -
플레이어 - · 경로 0점</div>
    <button class="ctrl primary" id="operatorCloseBtn" style="position:absolute; right:12px; top:12px;">게임으로</button>
  </div>
</div>

<div id="fallback">
  <div class="box">
    <h2>WebXR AR을 시작할 수 없습니다.</h2>
    <p>ARCore 지원 Android + 최신 Chrome + HTTPS 주소인지 확인해 주세요.</p>
    <p id="fallbackDetail"></p>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
